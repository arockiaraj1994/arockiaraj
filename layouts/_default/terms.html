{{ define "main" }}
<header style="padding-top: 2rem;">
  <h1 class="page__title">{{ .Title }}</h1>
</header>
<ul class="term-list">
  {{ range .Data.Terms.Alphabetical }}
  <li>
    <a href="{{ .Page.Permalink }}">{{ .Page.Title }}</a>
    <span class="count">{{ .Count }}</span>
  </li>
  {{ end }}
</ul>
{{ end }}
