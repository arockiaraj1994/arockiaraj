<header class="site-header">
  <div class="site">
    <div class="site-header__row">
      <a class="site-id" href="{{ .Site.BaseURL }}">{{ .Site.Params.shortId | default .Site.Title }}</a>
      <nav class="site-nav" aria-label="Main">
        {{ range .Site.Menus.main }}
          <a href="{{ .URL | relLangURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
        {{ end }}
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme">theme</button>
      </nav>
    </div>
  </div>
</header>
