<text x="40" y="56" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1E1B4B" text-anchor="start">MoneyBook: simple flow</text>
<text x="40" y="88" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#64748B" text-anchor="start">Three everyday flows. The app only shows things; changes go through Claude, and I approve them.</text>
