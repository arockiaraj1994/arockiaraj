<text x="30" y="44" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E1B4B" text-anchor="start">Expenses: from an alert to a clean row</text>
<rect x="30" y="70" width="210" height="104" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<circle cx="56" cy="103.0" r="13" fill="#7C3AED"/>
<text x="56" y="108.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="78" y="109.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1E1B4B" text-anchor="start">Alert email</text>
<text x="46" y="131.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Bank sends it</text>
<text x="46" y="150.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">after I pay</text>
<rect x="274" y="70" width="210" height="104" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<circle cx="300" cy="103.0" r="13" fill="#7C3AED"/>
<text x="300" y="108.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="322" y="109.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1E1B4B" text-anchor="start">Parser</text>
<text x="290" y="131.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Apps Script reads it;</text>
<text x="290" y="150.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Gemini extracts</text>
<rect x="518" y="70" width="210" height="104" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<circle cx="544" cy="103.0" r="13" fill="#7C3AED"/>
<text x="544" y="108.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="566" y="109.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1E1B4B" text-anchor="start">Signed push</text>
<text x="534" y="131.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">HTTPS + signature,</text>
<text x="534" y="150.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">time check, no repeats</text>
<rect x="762" y="70" width="210" height="104" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<circle cx="788" cy="103.0" r="13" fill="#7C3AED"/>
<text x="788" y="108.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="810" y="109.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1E1B4B" text-anchor="start">Raw row</text>
<text x="778" y="131.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Saved as parsed,</text>
<text x="778" y="150.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">never edited</text>
<rect x="1006" y="70" width="210" height="104" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<circle cx="1032" cy="103.0" r="13" fill="#7C3AED"/>
<text x="1032" y="108.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="1054" y="109.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1E1B4B" text-anchor="start">Rules</text>
<text x="1022" y="131.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Account, payee and</text>
<text x="1022" y="150.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">amount rules</text>
<rect x="1250" y="70" width="210" height="104" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<circle cx="1276" cy="103.0" r="13" fill="#7C3AED"/>
<text x="1276" y="108.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="1298" y="109.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1E1B4B" text-anchor="start">Clean row</text>
<text x="1266" y="131.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Category, type,</text>
<text x="1266" y="150.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">"needs a check"</text>
<text x="30" y="208" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#64748B" text-anchor="start">Raw rows stay as they came. If a rule changes, clean rows are simply made again.</text>
</svg>
