<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="230" viewBox="0 0 1490 230" role="img" aria-label="Expenses: from an alert to a clean row">
<title>Expenses: from an alert to a clean row</title><defs><marker id="a7C3AED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs>
<rect width="1490" height="230" fill="#FFFFFF"/>
<path d="M240,122.0 L272,122.0" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a7C3AED)"/>
<path d="M484,122.0 L516,122.0" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a7C3AED)"/>
<path d="M728,122.0 L760,122.0" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a7C3AED)"/>
