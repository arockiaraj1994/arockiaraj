<text x="40" y="56" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1E1B4B" text-anchor="start">MoneyBook: architecture</text>
<text x="40" y="88" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" fill="#64748B" text-anchor="start">One small server, one database. The app only reads; every write goes through one command-line tool.</text>
<rect x="40" y="260" width="240" height="90" rx="14" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
<text x="56" y="301.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1B4B" text-anchor="start">Bank alert emails</text>
<text x="56" y="323.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">In my Gmail</text>
<rect x="40" y="640" width="240" height="80" rx="14" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
<text x="56" y="676.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1B4B" text-anchor="start">Broker API</text>
<text x="56" y="698.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Holdings (read only)</text>
<rect x="40" y="740" width="240" height="80" rx="14" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
<text x="56" y="776.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1B4B" text-anchor="start">Price feed</text>
<text x="56" y="798.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Daily stock prices</text>
<rect x="350" y="240" width="300" height="90" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<text x="366" y="272.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1B4B" text-anchor="start">Parser (Apps Script)</text>
<text x="366" y="294.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Reads each alert email;</text>
<text x="366" y="313.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Gemini pulls out the details</text>
<rect x="350" y="370" width="300" height="80" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<text x="366" y="406.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1B4B" text-anchor="start">Google Sheet</text>
<text x="366" y="428.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">A log of every alert</text>
<rect x="730" y="160" width="500" height="60" rx="14" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
<text x="746" y="186.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1B4B" text-anchor="start">Caddy</text>
<text x="746" y="208.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">HTTPS in front of everything</text>
<rect x="730" y="260" width="230" height="90" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<text x="746" y="292.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1B4B" text-anchor="start">Ingest</text>
<text x="746" y="314.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Checks the signature,</text>
<text x="746" y="333.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">saves the raw row</text>
<rect x="1000" y="260" width="230" height="90" rx="14" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
<text x="1016" y="292.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1B4B" text-anchor="start">Login</text>
<text x="1016" y="314.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Keycloak + oauth2-proxy;</text>
<text x="1016" y="333.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">only me</text>
<rect x="1000" y="390" width="230" height="90" rx="14" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
<text x="1016" y="422.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1B4B" text-anchor="start">Read API</text>
<text x="1016" y="444.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">FastAPI, read only;</text>
<text x="1016" y="463.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">checks login again</text>
<rect x="730" y="520" width="500" height="120" rx="14" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
<text x="746" y="557.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1B4B" text-anchor="start">Postgres</text>
<text x="746" y="579.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">One database, one schema per area:</text>
<text x="746" y="598.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">expenses · invest · loans · cards · research · plan · AI notes</text>
<text x="746" y="617.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Schema changes only through Alembic migrations</text>
<rect x="730" y="680" width="230" height="90" rx="14" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/>
<text x="746" y="712.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1B4B" text-anchor="start">td.py tool</text>
<text x="746" y="734.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Every write and sync;</text>
<text x="746" y="753.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">used by Claude and timers</text>
<rect x="1000" y="680" width="230" height="90" rx="14" fill="#FFFFFF" stroke="#0891B2" stroke-width="2"/>
<text x="1016" y="712.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1B4B" text-anchor="start">Timers</text>
<text x="1016" y="734.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Clean rows every 15 min,</text>
<text x="1016" y="753.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">sync 3× on weekdays</text>
<rect x="1320" y="160" width="240" height="70" rx="14" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
<text x="1336" y="191.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1B4B" text-anchor="start">Browser</text>
<text x="1336" y="213.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Desktop web (SvelteKit)</text>
<rect x="1320" y="250" width="240" height="90" rx="14" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
<text x="1336" y="282.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1B4B" text-anchor="start">Android app</text>
<text x="1336" y="304.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Kotlin + Compose;</text>
<text x="1336" y="323.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">home-screen widget</text>
<rect x="1320" y="520" width="240" height="90" rx="14" fill="#FFFFFF" stroke="#DB2777" stroke-width="2"/>
<text x="1336" y="552.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1B4B" text-anchor="start">Claude Code</text>
<text x="1336" y="574.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Runs on the server;</text>
<text x="1336" y="593.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">I talk to it from my phone</text>
<rect x="1320" y="660" width="240" height="90" rx="14" fill="#FFFFFF" stroke="#DB2777" stroke-width="2"/>
<text x="1336" y="692.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1B4B" text-anchor="start">Reports &amp; papers</text>
<text x="1336" y="714.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Research PDFs, receipts,</text>
<text x="1336" y="733.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">card terms</text>
<rect x="350" y="895" width="300" height="70" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
<text x="366" y="926.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E1B4B" text-anchor="start">Cloud backup</text>
<text x="366" y="948.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#64748B" text-anchor="start">Nightly server backup job</text>
<text x="92" y="1015" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1E1B4B" text-anchor="start">A payment alert</text>
<text x="392" y="1015" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1E1B4B" text-anchor="start">Prices and holdings</text>
<text x="692" y="1015" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1E1B4B" text-anchor="start">Changes I ask for</text>
<text x="992" y="1015" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1E1B4B" text-anchor="start">Reading the app</text>
<text x="1292" y="1015" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1E1B4B" text-anchor="start">Backup</text>
